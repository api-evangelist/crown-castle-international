aid: crown-castle-international
name: Crown Castle
kind: company
description: >-
  Crown Castle is a leading United States provider of shared communications
  infrastructure including cell towers, small cells, and fiber. Crown
  Castle owns and operates more than 40,000 cell towers and approximately
  90,000 route miles of fiber, supporting wireless carriers, enterprises,
  and government customers with managed connectivity, dark fiber, optical
  encryption, ultra-low-latency transport, and managed SD-WAN services.
  Crown Castle does not currently publish a public developer API program;
  technical integrations are handled through customer and channel partner
  agreements.
